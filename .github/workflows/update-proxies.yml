name: Update proxy list

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-proxies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "proxies/tests/*.test.mjs"
      # Exits non-zero when nothing works, which leaves the published list untouched.
      - run: node proxies/update.mjs "$RUNNER_TEMP/list"
      - name: Publish to the proxy-list branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin proxy-list; then
            git fetch origin proxy-list:proxy-list
            git worktree add "$RUNNER_TEMP/publish" proxy-list
          else
            git worktree add --orphan -b proxy-list "$RUNNER_TEMP/publish"
          fi
          cp "$RUNNER_TEMP/list/proxies.json" "$RUNNER_TEMP/list/proxy.pac" "$RUNNER_TEMP/publish/"
          cd "$RUNNER_TEMP/publish"
          git add proxies.json proxy.pac
          git commit -m "chore: update proxy list"
          git push origin proxy-list
